<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>美化</title>
<style>
  :root{--page-bg:#f5f5f7;--card-bg:#fff;--ink:#1c1c1e;--sub:#8a8a8e;--line:rgba(0,0,0,.06)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--page-bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC",sans-serif;
    color:var(--ink);
    display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent
  }

  /* 顶部导航 */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:max(14px,env(safe-area-inset-top)) 10px 12px;
    position:relative;z-index:5;
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--ink);cursor:pointer;transition:background .15s,transform .1s;flex-shrink:0;
  }
  .back-btn:active{background:rgba(0,0,0,.06);transform:scale(.92)}
  .topbar h1{font-size:17px;font-weight:600;flex:1;text-align:center;margin-right:34px}

  /* 内容滚动区 */
  .scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 130px}
  .scroll::-webkit-scrollbar{display:none}

  /* 预览手机 */
  .preview-wrap{display:flex;justify-content:center;padding:6px 0 22px}
  .mini-phone{
    width:156px;height:318px;border-radius:34px;padding:8px;
    background:#111;box-shadow:0 18px 40px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
    position:relative;
  }
  .mini-screen{
    width:100%;height:100%;border-radius:27px;overflow:hidden;position:relative;
    background-color:var(--mp-bg,#f7f7f7);
    background-image:var(--mp-wallpaper,none);
    background-size:cover;background-position:center;
    display:flex;flex-direction:column;
    font-family:var(--mp-font,inherit);
  }
  .mini-notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:46px;height:14px;border-radius:8px;background:#111;z-index:3}
  .mini-icons{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;padding:30px 12px 8px;align-content:start}
  .mini-app{display:flex;flex-direction:column;align-items:center;gap:4px}
  .mini-icon{
    width:26px;height:26px;background:#fff;border-radius:var(--mp-radius,8px);
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .mini-label{font-size:6px;color:var(--mp-label,#888);text-shadow:var(--mp-label-shadow,none);font-weight:500}
  .mini-dock-wrap{padding:0 8px 10px;display:flex;justify-content:center}
  .mini-dock{
    width:100%;height:34px;border-radius:14px;background:rgba(255,255,255,.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  }
  .mini-dock .mini-icon{width:20px;height:20px;border-radius:var(--mp-radius-s,6px)}
  .mini-dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
  .mini-dot{width:3px;height:3px;border-radius:50%;background:rgba(0,0,0,.15)}
  .mini-dot.active{background:var(--mp-accent,#111827)}

  /* 分区卡片 */
  .section{margin-bottom:22px}
  .section h2{font-size:13px;font-weight:600;color:var(--sub);margin:0 4px 10px;letter-spacing:.3px}
  .card{
    background:var(--card-bg);border-radius:20px;padding:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.04);border:1px solid var(--line);
  }

  /* 壁纸网格 */
  .wallpaper-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .wp-swatch{
    aspect-ratio:1;border-radius:16px;position:relative;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:transform .12s ease;
  }
  .wp-swatch:active{transform:scale(.93)}
  .wp-swatch.selected::after{
    content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .wp-name{font-size:10px;color:var(--sub);text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wp-cell{display:flex;flex-direction:column}
  .wp-upload{
    aspect-ratio:1;border-radius:16px;border:1.5px dashed rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#aaa;cursor:pointer;
    background:rgba(0,0,0,.02);
  }
  .wp-upload:active{background:rgba(0,0,0,.05)}
  .wp-color-input{
    aspect-ratio:1;border-radius:16px;border:0;padding:0;cursor:pointer;overflow:hidden;
  }

  /* 文字深浅 */
  .segmented{display:flex;background:rgba(0,0,0,.05);border-radius:12px;padding:3px;gap:3px}
  .segmented button{
    flex:1;border:0;background:transparent;padding:8px 0;border-radius:9px;font-size:13px;font-weight:500;
    color:var(--sub);cursor:pointer;transition:background .15s,color .15s;
  }
  .segmented button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}

  /* 字体列表 */
  .font-list{display:flex;flex-direction:column;gap:2px}
  .font-row{
    display:flex;align-items:center;justify-content:space-between;padding:12px 6px;
    border-radius:12px;cursor:pointer;transition:background .15s;
  }
  .font-row:active{background:rgba(0,0,0,.04)}
  .font-row + .font-row{border-top:1px solid var(--line)}
  .font-sample{font-size:16px}
  .font-tick{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:700;background:var(--mp-accent,#111827);opacity:0;transition:opacity .15s}
  .font-row.active .font-tick{opacity:1}

  /* 强调色 */
  .accent-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .accent-dot{
    width:32px;height:32px;border-radius:50%;cursor:pointer;position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s;
  }
  .accent-dot:active{transform:scale(.9)}
  .accent-dot.selected::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);
  }
  .accent-custom{
    width:32px;height:32px;border-radius:50%;border:0;padding:0;cursor:pointer;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }

  /* 滑杆 */
  .slider-row{display:flex;flex-direction:column;gap:10px}
  .slider-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
  input[type=range]{width:100%;accent-color:var(--mp-accent,#111827)}

  /* 底部操作条 */
  .action-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:12px 16px max(16px,env(safe-area-inset-bottom));
    display:flex;gap:10px;
    background:linear-gradient(to top,rgba(245,245,247,.96) 60%,rgba(245,245,247,0));
  }
  .action-bar button{
    flex:1;height:46px;border-radius:16px;border:0;font-size:15px;font-weight:600;cursor:pointer;
    transition:transform .1s,opacity .1s;
  }
  .action-bar button:active{transform:scale(.97);opacity:.85}
  .btn-reset{background:#fff;color:#ff453a;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid var(--line)}
  .btn-done{background:var(--mp-accent,#111827);color:var(--mp-accent-text,#fff);box-shadow:0 8px 20px rgba(0,0,0,.14)}
</style>
</head>
<body>

<div class="topbar">
  <div class="back-btn" id="backBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <h1>美化</h1>
</div>

<div class="scroll">

  <div class="preview-wrap">
    <div class="mini-phone">
      <div class="mini-screen" id="miniScreen">
        <div class="mini-notch"></div>
        <div class="mini-icons" id="miniIcons"></div>
        <div class="mini-dock-wrap">
          <div class="mini-dock" id="miniDock"></div>
        </div>
        <div class="mini-dots">
          <div class="mini-dot"></div><div class="mini-dot active" id="miniDotActive"></div><div class="mini-dot"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>壁纸</h2>
    <div class="card">
      <div class="wallpaper-grid" id="wallpaperGrid"></div>
    </div>
  </div>

  <div class="section">
    <h2>文字深浅</h2>
    <div class="card">
      <div class="segmented" id="darkSeg">
        <button data-v="0" class="active">浅色文字</button>
        <button data-v="1">深色壁纸配浅字</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>字体</h2>
    <div class="card">
      <div class="font-list" id="fontList"></div>
    </div>
  </div>

  <div class="section">
    <h2>强调色</h2>
    <div class="card">
      <div class="accent-row" id="accentRow"></div>
    </div>
  </div>

  <div class="section">
    <h2>图标圆润度</h2>
    <div class="card">
      <div class="slider-row">
        <input type="range" id="radiusSlider" min="8" max="30" step="1">
        <div class="slider-labels"><span>方一点</span><span>圆一点</span></div>
      </div>
    </div>
  </div>

</div>

<div class="action-bar">
  <button class="btn-reset" id="resetBtn">恢复默认</button>
  <button class="btn-done" id="doneBtn">完成</button>
</div>

<script>
(function(){
  const STORE_KEY='phoneTheme';
  const PHONE_FILE='小手机毛胚.html';

  const WALLPAPERS=[
    {id:'default',name:'简约白',css:'none',bg:'#f7f7f7',dark:false,swatch:'linear-gradient(135deg,#fdfdfd,#e9e9e8)'},
    {id:'fog',name:'晨雾蓝',css:'linear-gradient(160deg,#dfe9f7 0%,#c5d8ea 45%,#a9c3dd 100%)',bg:'#c9dbee',dark:false,swatch:'linear-gradient(160deg,#dfe9f7,#a9c3dd)'},
    {id:'sakura',name:'樱花粉',css:'linear-gradient(160deg,#ffe6ec 0%,#ffd0dd 45%,#ffbfd4 100%)',bg:'#ffd6e2',dark:false,swatch:'linear-gradient(160deg,#ffe6ec,#ffbfd4)'},
    {id:'mint',name:'薄荷绿',css:'linear-gradient(160deg,#e6f8ee 0%,#c9edd9 45%,#aee2c8 100%)',bg:'#d3eedd',dark:false,swatch:'linear-gradient(160deg,#e6f8ee,#aee2c8)'},
    {id:'sunset',name:'落日橙',css:'linear-gradient(160deg,#ffdaa9 0%,#ffb199 45%,#ff8fab 100%)',bg:'#ffb999',dark:false,swatch:'linear-gradient(160deg,#ffdaa9,#ff8fab)'},
    {id:'lilac',name:'薰衣草紫',css:'linear-gradient(160deg,#ece3fb 0%,#d7c6f2 45%,#c4aeea 100%)',bg:'#d7c6f2',dark:false,swatch:'linear-gradient(160deg,#ece3fb,#c4aeea)'},
    {id:'midnight',name:'深空黑',css:'linear-gradient(165deg,#232838 0%,#14161f 55%,#05060a 100%)',bg:'#14161f',dark:true,swatch:'linear-gradient(165deg,#232838,#05060a)'},
    {id:'ocean',name:'深海蓝',css:'linear-gradient(165deg,#123152 0%,#0b2036 55%,#050d18 100%)',bg:'#0b2036',dark:true,swatch:'linear-gradient(165deg,#123152,#050d18)'},
  ];

  const FONTS=[
    {id:'system',name:'系统默认',stack:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC",sans-serif'},
    {id:'rounded',name:'圆体',stack:'"SF Pro Rounded","PingFang SC","Helvetica Rounded",-apple-system,sans-serif'},
    {id:'pingfang',name:'苹方 · 雅黑',stack:'"PingFang SC","Microsoft YaHei",-apple-system,sans-serif'},
    {id:'serif',name:'衬线',stack:'Georgia,"Songti SC","STSong","Times New Roman",serif'},
    {id:'hand',name:'手写风',stack:'"Segoe Print","Xingkai SC","Comic Sans MS",cursive'},
    {id:'mono',name:'等宽',stack:'"SF Mono",Menlo,Consolas,monospace'},
  ];

  const ACCENTS=['#111827','#2563eb','#ec4899','#f59e0b','#10b981','#8b5cf6','#ef4444'];

  const DEFAULT_THEME={
    wallpaperId:'default',wallpaperCSS:'none',bgColor:'#f7f7f7',dark:false,
    fontId:'system',font:FONTS[0].stack,
    accent:'#111827',iconRadius:18
  };

  function loadTheme(){
    try{return Object.assign({},DEFAULT_THEME,JSON.parse(localStorage.getItem(STORE_KEY)||'{}'))}
    catch(e){return Object.assign({},DEFAULT_THEME)}
  }
  function saveTheme(t){try{localStorage.setItem(STORE_KEY,JSON.stringify(t))}catch(e){}}

  function accentTextFor(hex){
    hex=(hex||'#111827').replace('#','');
    if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
    const r=parseInt(hex.substr(0,2),16)||0,g=parseInt(hex.substr(2,2),16)||0,b=parseInt(hex.substr(4,2),16)||0;
    return (0.299*r+0.587*g+0.114*b)/255>0.6?'#111':'#fff';
  }

  let theme=loadTheme();

  const miniScreen=document.getElementById('miniScreen');
  const miniIcons=document.getElementById('miniIcons');
  const miniDock=document.getElementById('miniDock');
  const miniDotActive=document.getElementById('miniDotActive');
  const wallpaperGrid=document.getElementById('wallpaperGrid');
  const fontList=document.getElementById('fontList');
  const accentRow=document.getElementById('accentRow');
  const radiusSlider=document.getElementById('radiusSlider');
  const darkSeg=document.getElementById('darkSeg');

  for(let i=0;i<8;i++){const a=document.createElement('div');a.className='mini-app';a.innerHTML='<div class="mini-icon"></div><div class="mini-label">App</div>';miniIcons.appendChild(a)}
  for(let i=0;i<4;i++){const ic=document.createElement('div');ic.className='mini-icon';miniDock.appendChild(ic)}

  function renderPreview(){
    miniScreen.style.setProperty('--mp-bg',theme.bgColor);
    miniScreen.style.setProperty('--mp-wallpaper',theme.wallpaperCSS);
    miniScreen.style.setProperty('--mp-font',theme.font);
    miniScreen.style.setProperty('--mp-radius',theme.iconRadius*0.4+'px');
    miniScreen.style.setProperty('--mp-radius-s',theme.iconRadius*0.3+'px');
    miniScreen.style.setProperty('--mp-accent',theme.accent);
    miniScreen.style.setProperty('--mp-accent-text',accentTextFor(theme.accent));
    if(theme.dark){
      miniScreen.style.setProperty('--mp-label','rgba(255,255,255,.9)');
      miniScreen.style.setProperty('--mp-label-shadow','0 1px 3px rgba(0,0,0,.4)');
    }else{
      miniScreen.style.setProperty('--mp-label','#888');
      miniScreen.style.setProperty('--mp-label-shadow','none');
    }
    document.querySelectorAll('.btn-done').forEach(()=>{});
    document.documentElement.style.setProperty('--mp-accent',theme.accent);
    document.documentElement.style.setProperty('--mp-accent-text',accentTextFor(theme.accent));
  }

  function persist(){saveTheme(theme);renderPreview()}

  // 壁纸网格
  function renderWallpapers(){
    wallpaperGrid.innerHTML='';
    WALLPAPERS.forEach(w=>{
      const cell=document.createElement('div');cell.className='wp-cell';
      const sw=document.createElement('div');
      sw.className='wp-swatch'+(theme.wallpaperId===w.id?' selected':'');
      sw.style.background=w.swatch;
      sw.addEventListener('click',()=>{
        theme.wallpaperId=w.id;theme.wallpaperCSS=w.css;theme.bgColor=w.bg;theme.dark=w.dark;
        persist();renderWallpapers();renderDarkSeg();
      });
      const name=document.createElement('div');name.className='wp-name';name.textContent=w.name;
      cell.appendChild(sw);cell.appendChild(name);
      wallpaperGrid.appendChild(cell);
    });
    // 自定义图片
    const upCell=document.createElement('div');upCell.className='wp-cell';
    const upload=document.createElement('label');upload.className='wp-upload';upload.textContent='+';
    const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.style.display='none';
    fileInput.addEventListener('change',e=>{
      const file=e.target.files&&e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        theme.wallpaperId='custom';theme.wallpaperCSS='url("'+ev.target.result+'")';
        persist();renderWallpapers();
      };
      reader.readAsDataURL(file);
    });
    upload.appendChild(fileInput);
    const upName=document.createElement('div');upName.className='wp-name';upName.textContent='自定义图片';
    upCell.appendChild(upload);upCell.appendChild(upName);
    wallpaperGrid.appendChild(upCell);
    // 自定义颜色
    const colorCell=document.createElement('div');colorCell.className='wp-cell';
    const colorInput=document.createElement('input');colorInput.type='color';colorInput.className='wp-color-input';colorInput.value=/^#/.test(theme.bgColor)?theme.bgColor:'#f7f7f7';
    colorInput.addEventListener('input',e=>{
      theme.wallpaperId='color';theme.wallpaperCSS='none';theme.bgColor=e.target.value;
      persist();renderWallpapers();
    });
    const colorName=document.createElement('div');colorName.className='wp-name';colorName.textContent='纯色';
    colorCell.appendChild(colorInput);colorCell.appendChild(colorName);
    wallpaperGrid.appendChild(colorCell);
  }

  function renderDarkSeg(){
    Array.from(darkSeg.children).forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.v)===(theme.dark?1:0)));
  }
  darkSeg.addEventListener('click',e=>{
    const btn=e.target.closest('button');if(!btn)return;
    theme.dark=Number(btn.dataset.v)===1;
    persist();renderDarkSeg();
  });

  function renderFonts(){
    fontList.innerHTML='';
    FONTS.forEach(f=>{
      const row=document.createElement('div');
      row.className='font-row'+(theme.fontId===f.id?' active':'');
      row.innerHTML='<span class="font-sample" style="font-family:'+f.stack+'">'+f.name+' · Aa 汉字</span><span class="font-tick">✓</span>';
      row.addEventListener('click',()=>{
        theme.fontId=f.id;theme.font=f.stack;
        persist();renderFonts();
      });
      fontList.appendChild(row);
    });
  }

  function renderAccents(){
    accentRow.innerHTML='';
    ACCENTS.forEach(c=>{
      const dot=document.createElement('div');
      dot.className='accent-dot'+(theme.accent===c?' selected':'');
      dot.style.background=c;
      dot.addEventListener('click',()=>{theme.accent=c;persist();renderAccents()});
      accentRow.appendChild(dot);
    });
    const custom=document.createElement('input');
    custom.type='color';custom.className='accent-custom';custom.value=theme.accent;
    custom.addEventListener('input',e=>{theme.accent=e.target.value;persist();renderAccents()});
    accentRow.appendChild(custom);
  }

  radiusSlider.value=theme.iconRadius;
  radiusSlider.addEventListener('input',e=>{theme.iconRadius=Number(e.target.value);persist()});

  function goBack(){
    if(document.referrer && document.referrer.indexOf(PHONE_FILE)!==-1 && history.length>1){history.back();return}
    location.href=PHONE_FILE;
  }
  document.getElementById('backBtn').addEventListener('click',goBack);
  document.getElementById('doneBtn').addEventListener('click',goBack);
  document.getElementById('resetBtn').addEventListener('click',()=>{
    theme=Object.assign({},DEFAULT_THEME);
    saveTheme(theme);
    renderPreview();renderWallpapers();renderDarkSeg();renderFonts();renderAccents();
    radiusSlider.value=theme.iconRadius;
  });

  renderPreview();renderWallpapers();renderDarkSeg();renderFonts();renderAccents();
})();
</script>
</body>
</html>
