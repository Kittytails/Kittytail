<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>美化</title>
<style>
:root{
  --bg:#f8f9fa;
  --card:#ffffff;
  --ink:#111111;
  --muted:#868e96;
  --line:#e9ecef;
  --soft:#f1f3f5;
  --radius-card: 24px;
  --radius-item: 16px;
  --radius-btn: 12px;
  --radius-thumb: 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.scroll{height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}

.section{margin-bottom:28px}
.card{background:var(--card);border:1px solid #e0e0e0;border-radius:var(--radius-card);overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.03)}
/* 统一了间距，放大标题，增强呼吸感 */
.card-header{padding:24px 20px 20px;display:flex;flex-direction:column;gap:8px}
.card-title{font-size:21px;font-weight:800;letter-spacing:-0.3px;color:var(--ink)}
.card-sub{font-size:12px;color:var(--muted);font-weight:500}

.row{min-height:64px;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--soft)}.row:last-child{border-bottom:0}
.row-main{min-width:0;flex:1}
.row-title{font-size:14px;font-weight:600;color:var(--ink)}
.row-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}

.upload-box{padding:0 20px 20px}
.upload-btn{width:100%;height:52px;border:1px dashed #ced4da;background:var(--bg);border-radius:var(--radius-item);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);transition:all .2s;cursor:pointer}
.upload-btn:active{background:#e9ecef;border-color:var(--muted);transform:scale(0.98)}
.network-icon{width:18px;height:18px;display:grid;place-items:center;color:#111;flex:0 0 18px;pointer-events:none}.network-icon svg{width:18px;height:18px;display:block}
.app-link-btn svg{width:15px;height:15px;display:block;color:#111}

.url-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;padding:16px}.url-modal.show{display:flex}.url-sheet{width:100%;max-width:520px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.url-sheet-title{font-size:16px;font-weight:750;margin-bottom:12px}.url-input{width:100%;height:48px;border:1px solid #dcdcdc;border-radius:13px;padding:0 14px;background:#f7f7f7;outline:none;font-size:13px;color:#111}.url-input:focus{background:#fff;border-color:#111}.url-actions{display:flex;gap:9px;margin-top:12px}.url-actions button{flex:1;height:44px;border-radius:12px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:650}.url-actions .url-ok{background:#111;color:#fff;border-color:#111}
.color-line{display:flex;align-items:center;gap:8px}
.color-input{width:42px;height:42px;border:1px solid #dee2e6;border-radius:var(--radius-item);padding:2px;background:var(--card);overflow:hidden}
.hex{width:90px;height:42px;border:1px solid #dee2e6;border-radius:var(--radius-item);padding:0 12px;background:var(--bg);color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase;text-align:center;outline:none}
.hex:focus{background:var(--card);border-color:var(--ink)}

.small-btn{height:38px;border:1px solid #dee2e6;background:var(--card);border-radius:var(--radius-btn);padding:0 18px;font-size:12px;font-weight:600;color:var(--ink);transition:0.2s;display:flex;align-items:center;justify-content:center;cursor:pointer}
.small-btn.dark{background:var(--ink);color:var(--card);border-color:var(--ink)}
.small-btn:active{transform:scale(0.95)}

.swatches-wrap{padding:16px 20px;display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.swatches-wrap::-webkit-scrollbar{display:none}
.swatch{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid #dee2e6;position:relative;transition:all 0.2s;cursor:pointer}
.swatch.active{border:4px solid var(--card);outline:2px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.1)}

.bg-thumb{flex-shrink:0;width:52px;height:72px;border-radius:12px;border:1px solid #dee2e6;position:relative;transition:all 0.2s;cursor:pointer;background-size:cover;background-position:center;background-repeat:no-repeat}
.bg-thumb.active{border:3px solid var(--card);outline:2px solid var(--ink);box-shadow:0 2px 8px rgba(0,0,0,0.1)}

.font-list{border-top:1px solid var(--soft)}
.font-item{min-height:72px;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--soft)}.font-item:last-child{border-bottom:0}
.font-preview{flex:1;font-size:15px;color:var(--ink);font-weight:500}
.font-actions{display:flex;gap:8px}

.app-toolbar{padding:0 20px 16px;display:flex;gap:12px}
.dl-row{display:flex;align-items:center;gap:12px;margin:0 20px 16px;padding:12px 14px;background:var(--soft);border-radius:16px}
.dl-row-main{min-width:0;flex:1}
.dl-row-title{font-size:13px;font-weight:600;color:var(--ink)}
.dl-row-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.dl-switch{position:relative;flex:0 0 auto;width:44px;height:26px}
.dl-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.dl-switch-track{position:absolute;inset:0;background:#d1d1d6;border-radius:999px;transition:background .2s ease}
.dl-switch-track::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease}
.dl-switch input:checked + .dl-switch-track{background:#1c1c1e}
.dl-switch input:checked + .dl-switch-track::after{transform:translateX(18px)}
.app-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px 20px}
.app-item{display:flex;flex-direction:column;align-items:center;border:1px solid var(--soft);border-radius:var(--radius-item);background:var(--bg);position:relative;transition:all 0.2s;overflow:hidden}
.app-item-inner{padding:20px 12px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer}
.app-item:active .app-item-inner{background:#e9ecef}
.app-thumb{width:56px;height:56px;border-radius:var(--radius-thumb);background:#ffffff;border:1px solid #dee2e6;display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:12px;color:var(--muted);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.app-thumb img{width:100%;height:100%;object-fit:cover}
.app-name{font-size:14px;font-weight:600;color:var(--ink);transition:0.2s}
.app-link-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.app-link-btn{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid #d9d9d9;display:grid;place-items:center;padding:0;color:#111;cursor:pointer;transition:all .18s;box-shadow:0 2px 7px rgba(0,0,0,.06);z-index:20;pointer-events:auto;-webkit-appearance:none;appearance:none}
.app-link-btn:active{transform:scale(.92);background:#f1f1f1}
.app-shift{position:absolute;bottom:0;left:0;right:0;height:44px;background:rgba(255,255,255,0.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:space-evenly;border-top:1px solid var(--line);transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);z-index:3}
.edit-mode .app-shift{transform:translateY(0)}
.edit-mode .app-name{opacity:0.3}
.edit-mode .app-link-btn{opacity:1;pointer-events:auto}
.shift-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:bold;color:var(--ink);cursor:pointer}
.shift-btn:active{background:#e0e0e0}

.plan-row{min-height:72px;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--soft)}.plan-row:last-child{border-bottom:0}
.plan-info{flex:1;min-width:0}
.plan-name{font-size:14px;font-weight:700;color:var(--ink)}
.plan-time{font-size:11px;color:var(--muted);margin-top:6px}
.plan-actions{display:flex;gap:8px}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;font-weight:500}

.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.done{width:100%;height:52px;border:0;border-radius:16px;background:var(--ink);color:var(--card);font-size:15px;font-weight:700;letter-spacing:1px;transition:0.2s;cursor:pointer}
.done:active{transform:scale(0.98);background:#333}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top) + 12px);transform:translate(-50%,-14px);background:rgba(20,20,20,0.96);color:#fff;padding:16px 20px;border-radius:20px;font-size:13.5px;font-weight:600;line-height:1.6;text-align:left;max-width:min(94vw,420px);width:max-content;white-space:normal;word-break:break-word;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(0.34, 1.56, 0.64, 1);z-index:200;box-shadow: 0 10px 30px rgba(0,0,0,0.22)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<main class="scroll">
<section class="section">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Background</span>
      <span class="card-sub">自定义 / 纯色背景 / 图床链接</span>
    </div>
    
    <div class="upload-box" style="padding-bottom:12px; display:flex; gap:10px;">
      <label class="upload-btn" style="flex:1">＋ 本地图片<input id="bgFile" style="display:none" type="file" accept="image/*"></label>
      <button type="button" class="upload-btn" id="bgUrlBtn" style="flex:1"><span class="network-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.8 12h16.4M12 3.5c2.15 2.35 3.15 5.2 3.15 8.5S14.15 18.15 12 20.5M12 3.5C9.85 5.85 8.85 8.7 8.85 12S9.85 18.15 12 20.5" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg></span><span>网络链接</span></button>
    </div>
    <div class="row" id="bgHistoryRow" style="display:none; min-height:auto; padding-bottom:0; border-bottom:none;">
      <div class="row-main"><div class="row-title">历史背景图</div><div class="row-desc">点击应用，长按图片即可删除</div></div>
    </div>
    <div id="savedBgs" class="swatches-wrap" style="padding-top:12px;"></div>

    <div class="row">
      <div class="row-main"><div class="row-title">纯色背景</div></div>
      <div class="color-line"><input id="colorInput" class="color-input" type="color"><input id="hexInput" class="hex" value="#FFFFFF" maxlength="7"></div>
    </div>
    <div class="row">
      <div class="row-main"><div class="row-title">常用颜色</div><div class="row-desc">点击应用，长按色块即可删除</div></div>
      <button class="small-btn dark" id="saveColor">保存当前</button>
    </div>
    <div id="swatches" class="swatches-wrap"></div>
  </div>
</section>

<section class="section">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Typography</span>
      <span class="card-sub">系统默认 / 导入自定义字体文件</span>
    </div>
    <div class="upload-box">
      <label class="upload-btn">＋ 导入字体<input id="fontFile" style="display:none" type="file" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2"></label>
    </div>
    <div id="fontList" class="font-list"></div>
  </div>
</section>

<section class="section">
  <div class="card">
    <div class="card-header">
      <span class="card-title">App Icons</span>
      <span class="card-sub">点击更换本地图标，点击右上角设置网络图标</span>
    </div>
    <div class="app-toolbar">
      <label class="small-btn dark" style="flex:1; margin:0;">批量上传本地 <input id="bulkUpload" type="file" multiple accept="image/*" style="display:none"></label>
      <button class="small-btn" id="toggleAppEdit" style="flex:1">调整位置</button>
    </div>
    <div class="dl-row">
      <div class="dl-row-main">
        <div class="dl-row-title">上传时自动转直链</div>
        <div class="dl-row-desc">图标 / 字体 / 壁纸统一转存到「直链」配置的 GitHub 仓库，不占本地空间，也会同步出现在「直链」的资源库里</div>
      </div>
      <label class="dl-switch">
        <input type="checkbox" id="useDirectLink">
        <span class="dl-switch-track"></span>
      </label>
    </div>
    <div id="appList" class="app-list"></div>
  </div>
</section>

<section class="section">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Themes</span>
      <span class="card-sub">保存 / 调用主题方案</span>
    </div>
    <div class="row">
      <div class="row-main"><div class="row-title">保存当前配置</div><div class="row-desc">把当前背景、字体、图标存成一个方案，方便以后切换</div></div>
      <button class="small-btn dark" id="savePlanBtn">保存方案</button>
    </div>
    <div id="planList"></div>
  </div>
</section>
</main><div class="url-modal" id="urlModal"><div class="url-sheet"><div class="url-sheet-title">添加网络背景</div><input id="urlInput" class="url-input" type="url" inputmode="url" placeholder="粘贴图片链接"><div class="url-actions"><button type="button" id="urlCancel">取消</button><button type="button" class="url-ok" id="urlApply">应用</button></div></div></div>
<div class="bottom"><button class="done" id="doneBtn">完成并保存</button></div><div id="toast" class="toast"></div>

<script>
(()=>{
const KEY='phoneTheme', PLANS='phoneThemePlans', COLORS='phoneSavedColors', BGS='phoneSavedBgs';
const baseFonts=[{id:'system',name:'系统默认',stack:'-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif'}];
const apps=['微信','世界书','档案','设置','倒数日','美化','直链','仓库','短信','浏览器','电话','此刻'];
const $=id=>document.getElementById(id);

let theme=read(KEY,{bgColor:'#ffffff',wallpaperCSS:'none',fontId:'system',font:baseFonts[0].stack,customFonts:[],appIcons:{},appsOrder:null,savedColors:[]});
let colors=read(COLORS,theme.savedColors||[]); 
let savedBgs=read(BGS,[]);
let plans=read(PLANS,[]);
let currentApps = theme.appsOrder && theme.appsOrder.length ? theme.appsOrder : [...apps];
let appEditMode = false;

function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){if(e.name==='QuotaExceededError') toast('存储空间不足，这次改动没保存成功，删掉几张旧图片/背景再试试~');return false}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast._t);var dur=Math.max(1500,Math.min(4200,s.length*70));toast._t=setTimeout(()=>$('toast').classList.remove('show'),dur)}
function sync(){theme.appsOrder = currentApps; let ok=write(KEY,theme); ok=write(COLORS,colors)&&ok; ok=write(BGS,savedBgs)&&ok; try{window.dispatchEvent(new Event('phoneThemeSync')); if(window.opener)window.opener.postMessage({type:'phoneThemeSync'},'*'); if(window.parent&&window.parent!==window)window.parent.postMessage({type:'phoneThemeSync'},'*');}catch(e){} return ok;}

// ===== 直链集成：把图标改上传到「直链」里配置好的 GitHub 仓库，换成一个网址，
// 而不是把图片编码成又大又占地方的 base64 塞进 localStorage（这才是"存储空间不足"的根源）。
// 直接复用"直链"App自己保存Token/仓库名用的那几个localStorage键，两边配置是通的，不用重新填一遍。
const DL_TOKEN_PREF='useDirectLinkForIcons';
$('useDirectLink').checked = localStorage.getItem(DL_TOKEN_PREF)==='1';
$('useDirectLink').onchange=()=>{localStorage.setItem(DL_TOKEN_PREF, $('useDirectLink').checked?'1':'0')};

function dlSettings(){
  return {
    token:(localStorage.getItem('kb_standalone_token')||'').trim(),
    repo:(localStorage.getItem('kb_standalone_repo')||'').trim()||'kittytail-assets',
    proxy:(localStorage.getItem('kb_standalone_proxy')||'').trim().replace(/\/+$/,'')
  };
}
async function ghRequest(path,options,token,proxy){
  const base=proxy||'https://api.github.com';
  const res=await fetch(base+path,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...((options&&options.headers)||{})},cache:'no-store'});
  const text=await res.text();let data={};try{data=text?JSON.parse(text):{}}catch(e){data={message:text}}
  if(!res.ok) throw new Error(data.message||('HTTP '+res.status));
  return data;
}
function dlSafeName(name){
  name=String(name||'icon');
  const dot=name.lastIndexOf('.');
  let stem=dot>=0?name.slice(0,dot):name, ext=dot>=0?name.slice(dot):'.jpg';
  stem=stem.replace(/[^\w.\-\u4e00-\u9fff]+/g,'-').replace(/^[-.]+|[-.]+$/g,'')||('icon-'+Date.now());
  ext=ext.replace(/[^\w.]/g,'')||'.jpg';
  return stem+ext;
}
function dlCdnUrl(owner,repo,branch,path){
  return 'https://cdn.jsdelivr.net/gh/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo)+'@'+encodeURIComponent(branch)+'/'+path.split('/').map(encodeURIComponent).join('/');
}
// dataUrl: 已经是 data:image/...;base64,... 或字体的 data:font/...;base64,... 字符串；filename仅用于生成文件名；isImage决定存到images/还是fonts/目录
async function uploadAssetToDirectLink(dataUrl, filename, isImage){
  const s=dlSettings();
  if(!s.token) throw new Error('还没在「直链」里配置 GitHub Token');
  const user=await ghRequest('/user',{method:'GET'},s.token,s.proxy);
  const owner=user.login;
  let branch='main';
  try{
    const repoData=await ghRequest('/repos/'+owner+'/'+s.repo,{method:'GET'},s.token,s.proxy);
    branch=repoData.default_branch||'main';
  }catch(e){
    if(/404|Not Found/i.test(e.message||'')){
      const created=await ghRequest('/user/repos',{method:'POST',body:JSON.stringify({name:s.repo,auto_init:true})},s.token,s.proxy);
      branch=created.default_branch||'main';
    } else throw e;
  }
  const folder=isImage?'images':'fonts';
  const path=folder+'/'+Date.now()+'-'+dlSafeName(filename);
  const content=String(dataUrl).indexOf(',')>=0?String(dataUrl).split(',')[1]:String(dataUrl);
  const encodedPath=path.split('/').map(encodeURIComponent).join('/');
  await ghRequest('/repos/'+owner+'/'+s.repo+'/contents/'+encodedPath,{method:'PUT',body:JSON.stringify({message:'上传 '+path,content,branch})},s.token,s.proxy);
  const url=dlCdnUrl(owner,s.repo,branch,path);
  dlAddToHistory({name:filename,url,isImage:!!isImage,owner,repo:s.repo,branch,path});
  return url;
}
// 往「直链」自己的资源库历史记录里追加一条,字段跟直链.html里 addToHistory 存的完全一致,
// 这样打开「直链」App时,美化这边转的直链图片/字体在它的资源库列表里也能看到。
function dlAddToHistory(e){
  try{
    const key='kb_standalone_history';
    const list=JSON.parse(localStorage.getItem(key)||'[]');
    list.unshift({
      id:Date.now()+'-'+Math.random().toString(36).slice(2),
      name:e.name,url:e.url,isImage:!!e.isImage,isFont:!e.isImage,time:Date.now(),
      githubOwner:e.owner||'',githubRepo:e.repo||'',githubBranch:e.branch||'',githubPath:e.path||''
    });
    localStorage.setItem(key,JSON.stringify(list));
  }catch(err){}
}

// 色块处理
function applyColor(c){theme.bgColor=c;theme.wallpaperCSS='none';sync();$('colorInput').value=c;$('hexInput').value=c;renderSwatches();renderSavedBgs();}
$('colorInput').value=theme.bgColor||'#ffffff';$('hexInput').value=theme.bgColor||'#ffffff';
$('colorInput').oninput=e=>applyColor(e.target.value);$('hexInput').onchange=e=>{let v=e.target.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v))applyColor(v.toLowerCase());else $('hexInput').value=theme.bgColor};$('saveColor').onclick=()=>{let c=theme.bgColor;if(!colors.includes(c))colors.unshift(c);colors=colors.slice(0,18);if(sync())toast('颜色已保存');renderSwatches();};

function renderSwatches(){
  let box=$('swatches');box.innerHTML='';
  if(!colors.length){ box.style.display='none'; return; } else { box.style.display='flex'; }
  colors.forEach(c=>{
    let b=document.createElement('div');b.className='swatch'+(theme.bgColor===c?' active':'');b.style.background=c;b.title=c;
    let longPressTimer;
    const startPress = () => { longPressTimer = setTimeout(()=>{ colors = colors.filter(x=>x!==c); sync(); renderSwatches(); toast('已删除该颜色'); }, 500); };
    const cancelPress = () => { clearTimeout(longPressTimer); };
    b.addEventListener('touchstart', startPress, {passive: true}); b.addEventListener('touchend', cancelPress); b.addEventListener('touchcancel', cancelPress);
    b.addEventListener('mousedown', startPress); b.addEventListener('mouseup', cancelPress); b.addEventListener('mouseleave', cancelPress);
    b.onclick = () => applyColor(c);
    box.appendChild(b);
  })
}

const readFile = (file) => new Promise(resolve => {
    let r = new FileReader(); r.onload = x => resolve(x.target.result); r.readAsDataURL(file);
});

// 压缩图片:限制最长边尺寸+转成JPEG压缩质量,能把手机原图(动辄几MB)
// 压到几十到一两百KB,同样的localStorage配额能多存好几倍的图标/背景。
function compressImage(file, maxDim, quality){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        // 先铺白底,避免带透明通道的图压成JPEG后透明区域变黑
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(err){ resolve(e.target.result); }
      };
      img.onerror = ()=> resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.onerror = ()=> resolve(null);
    reader.readAsDataURL(file);
  });
}

$('bulkUpload').onchange = async (ev) => {
    let files = Array.from(ev.target.files);
    if (!files.length) return;
    const useDL = $('useDirectLink').checked;
    toast(useDL ? '正在批量处理并转直链...' : '正在批量处理...');
    theme.appIcons = theme.appIcons || {};
    let fileIdx = 0;
    let dlFailCount = 0, dlFailReason = '';
    for (let name of currentApps) {
        if (fileIdx >= files.length) break;
        let fileToUse = files.find(f => f.name.replace(/\.[^/.]+$/, "") === name) || files[fileIdx++];
        if (!fileToUse) continue;
        const compressed = await compressImage(fileToUse, 240, 0.85);
        if (useDL) {
            try { theme.appIcons[name] = await uploadAssetToDirectLink(compressed, name + ".jpg", true); }
            catch (err) { dlFailCount++; dlFailReason = err.message || '未知错误'; theme.appIcons[name] = compressed; }
        } else {
            theme.appIcons[name] = compressed;
        }
    }
    renderApps();
    const ok = sync();
    if (dlFailCount) toast(dlFailCount + ' 张转直链失败（' + dlFailReason + '），已改存本地');
    else if (ok) toast(useDL ? '批量上传完成，已转为直链' : '批量上传完成');
    ev.target.value = '';
};

function renderApps(){
  let box=$('appList');box.innerHTML='';
  currentApps.forEach((name, i)=>{
    let item=document.createElement('div');item.className='app-item';
    
    // 图标和文字包裹

    let thumb=document.createElement('div');thumb.className='app-thumb';
    if(theme.appIcons&&theme.appIcons[name]){let im=document.createElement('img');im.src=theme.appIcons[name];thumb.appendChild(im)}else thumb.textContent=name.slice(0,2);
    let main=document.createElement('div'); main.className='app-name'; main.textContent=name;
    let input=document.createElement('input');input.type='file';input.accept='image/*';input.style.display='none';
    input.onchange=async ev=>{
      let f=ev.target.files[0];if(!f)return;
      const compressed = await compressImage(f, 240, 0.85);
      theme.appIcons=theme.appIcons||{};
      const useDL = $('useDirectLink').checked;
      if(useDL){
        try{
          theme.appIcons[name]=await uploadAssetToDirectLink(compressed, name+'.jpg', true);
        }catch(err){
          theme.appIcons[name]=compressed;
          renderApps(); sync();
          toast('转直链失败（'+(err.message||'未知错误')+'），已改存本地');
          return;
        }
      } else {
        theme.appIcons[name]=compressed;
      }
      let ok=sync();renderApps();if(ok)toast(name+(useDL?' 直链已保存并同步':' 图标已保存并同步'));
    };
    lab.append(thumb, main, input);
    lab.addEventListener('click',e=>{if(e.target===lab||e.target===thumb||e.target===main)input.click()});

    let linkBtn=document.createElement('button'); linkBtn.type='button'; linkBtn.className='app-link-btn'; linkBtn.setAttribute('aria-label',name+'网络图标');
    linkBtn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.9 12h16.2M12 3.8c2 2.25 3 5 3 8.2s-1 5.95-3 8.2M12 3.8c-2 2.25-3 5-3 8.2s1 5.95 3 8.2" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg>';
    linkBtn.addEventListener('click',e=>{
      e.preventDefault(); e.stopPropagation();
      openUrlModal('app',name);
    });

    // 左右位移按钮
    let shift=document.createElement('div'); shift.className='app-shift';
    let leftBtn=document.createElement('div'); leftBtn.className='shift-btn'; leftBtn.textContent='←';
    leftBtn.onclick=(e)=>{e.preventDefault(); e.stopPropagation(); moveApp(i, -1);};
    let rightBtn=document.createElement('div'); rightBtn.className='shift-btn'; rightBtn.textContent='→';
    rightBtn.onclick=(e)=>{e.preventDefault(); e.stopPropagation(); moveApp(i, 1);};
    shift.append(leftBtn, rightBtn);

    item.append(lab, linkBtn, shift);
    item.addEventListener('click',e=>{ if(e.target.closest('.app-link-btn,.shift-btn,input')) return; }); 
    box.appendChild(item);
  })
}

// 方案处理
function currentSnapshot(){return JSON.parse(JSON.stringify({bgColor:theme.bgColor,wallpaperCSS:theme.wallpaperCSS,backgroundName:theme.backgroundName,fontId:theme.fontId,font:theme.font,customFonts:theme.customFonts||[],appIcons:theme.appIcons||[],appsOrder:theme.appsOrder||[]}))}
function renderPlans(){let box=$('planList');box.innerHTML='';if(!plans.length){box.innerHTML='<div class="empty">还没有保存主题方案</div>';return}plans.forEach((p,i)=>{let row=document.createElement('div');row.className='plan-row';row.innerHTML='<div class="plan-info"><div class="plan-name"></div><div class="plan-time"></div></div>';row.querySelector('.plan-name').textContent=p.name;row.querySelector('.plan-time').textContent=new Date(p.time).toLocaleString();let ac=document.createElement('div');ac.className='plan-actions';let use=document.createElement('button');use.className='small-btn dark';use.textContent='使用';use.onclick=()=>{theme=Object.assign(theme,p.data);currentApps=theme.appsOrder||[...apps];let ok=sync();injectFonts();renderFonts();renderApps();renderSavedBgs();renderSwatches();if(ok)toast('方案已应用')};let del=document.createElement('button');del.className='small-btn';del.textContent='删除';del.onclick=()=>{plans.splice(i,1);write(PLANS,plans);renderPlans()};ac.append(use,del);row.append(ac);box.appendChild(row)})}

function savePlan(){let name=prompt('给当前方案取个名字');if(!name)return;plans.unshift({name:name.trim().slice(0,24),time:Date.now(),data:currentSnapshot()});plans=plans.slice(0,20);let ok=write(PLANS,plans);renderPlans();if(ok)toast('方案已保存')}
if($('savePlanBtn'))$('savePlanBtn').onclick=savePlan;
$('doneBtn').onclick=()=>{if(sync()){toast('配置已保存');setTimeout(goBack,450)}};
function goBack(){
  // 如果是被"小手机"外壳用 iframe 嵌进来打开的（同源），优先通知外壳把自己关掉，
  // 而不是在 iframe 内部 history.back() / 跳转——那样只会让 iframe 自己乱跳，
  // 关不掉外层的启动浮层。
  if(window.parent&&window.parent!==window){
    try{window.parent.postMessage({type:'closeApp'},'*');return}catch(e){}
  }
  // 只要浏览器历史里有上一页,直接用 history.back() 原路返回即可——
  // 不需要再核对 document.referrer 里是不是"小手机.html"这几个字。
  // 之前的问题就出在这:很多浏览器/GitHub Pages 会把 referrer 里的中文
  // 编码成 %E5%B0%8F%E6%89%8B... 这样的形式,indexOf('小手机.html')
  // 永远匹配不上,于是每次都被迫走"location.href='小手机.html'"这条
  // 硬编码兜底路径,一旦当前页面所在目录/域名和预期的不完全一致就会 404。
  if(history.length>1){
    history.back();
    return;
  }
  // 只有在没有可回退的历史记录时(比如美化页是被直接打开/刷新进来的),
  // 才退回到拼接跳转,并且基于当前页面所在目录来拼路径,而不是写死根路径,
  // 这样部署在子目录下也不会 404。
  var base=location.pathname.slice(0,location.pathname.lastIndexOf('/')+1);
  location.href=base+'小手机.html';
}

// 左滑退出（避开色块/背景缩略图的横向滚动区和弹窗）
(function(){
  let sx=0, sy=0, tracking=false;
  const THRESH=70;
  function shouldSkip(el){ return !!(el.closest('.swatches-wrap') || el.closest('.url-modal')); }
  document.addEventListener('touchstart', e=>{
    if(e.touches.length!==1 || shouldSkip(e.target)){ tracking=false; return }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!tracking) return; tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(dx<-THRESH && Math.abs(dx)>Math.abs(dy)*1.5) goBack();
  }, {passive:true});
})();

renderSwatches();renderSavedBgs();renderFonts();renderApps();renderPlans();

/* ===== 底栏跟随真实可视视口修正（同小手机主界面的修复，原理一致） ===== */
(function fixBottomBarToVisualViewport(){
  const bar=document.querySelector('.bottom');
  const vv=window.visualViewport;
  if(!bar||!vv)return;
  let raf=0;
  function apply(){
    raf=0;
    const gap=window.innerHeight-(vv.height+vv.offsetTop);
    bar.style.transform=gap>1?'translateY('+(-gap)+'px)':'';
  }
  function schedule(){if(!raf)raf=requestAnimationFrame(apply)}
  vv.addEventListener('resize',schedule);
  vv.addEventListener('scroll',schedule);
  window.addEventListener('orientationchange',()=>setTimeout(apply,300));
  apply();
})();
})();
