<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>手机界面 - 韩系ins风</title>
<style>
  :root{--bg-color:#f7f7f7;--text-color:#222;--gray-color:#888;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg-color);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  .dynamic-edit-pill{
    position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;
    transform:translateX(-50%) scale(.9) translateY(-90px);
    display:flex;align-items:center;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(25px) saturate(1.8);-webkit-backdrop-filter:blur(25px) saturate(1.8);
    border-radius:28px;padding:6px 8px;gap:4px;z-index:10000;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s .4s;
    box-shadow:0 16px 40px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.15);
    white-space:nowrap;
  }
  body.edit-mode .dynamic-edit-pill{
    transform:translateX(-50%) scale(1) translateY(0);
    opacity:1;visibility:visible;pointer-events:auto;
    transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .25s ease,visibility 0s;
  }
  .dep-btn{height:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
  .dep-btn:active{background:rgba(255,255,255,.15);transform:scale(.95)}
  .dep-btn.danger{color:#ff453a}
  .dep-btn.danger:active{background:rgba(255,69,58,.15)}
  .dep-btn.primary{background:#fff;color:#000;padding:0 18px;margin-left:2px}
  .dep-btn.primary:active{background:#e5e5e5}
  .dep-divider{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 2px;border-radius:1px}

  .pages-viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:10;touch-action:none;transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .desktop.home-page{position:absolute;inset:0;padding:24px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));align-content:start;gap:10px;overflow:hidden;visibility:hidden;pointer-events:none;transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;contain:layout style paint}
  .desktop.home-page.is-shown{visibility:visible}
  .desktop.home-page.active-page{pointer-events:auto;z-index:2}
  body.edit-mode .desktop.home-page{padding-top:78px}

  .desktop-grid{position:absolute;inset:24px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(80px,1fr));gap:10px;pointer-events:none;opacity:0;z-index:0;transition:opacity .18s ease}
  body.edit-mode .desktop-grid{opacity:1}
  .grid-slot{border-radius:20px;border:1px dashed rgba(0,0,0,.045);background:rgba(255,255,255,.08);transition:transform .12s ease,background .12s ease,border-color .12s ease,margin .12s ease;position:relative;z-index:0}
  .grid-slot.target{background:transparent!important;border-color:transparent!important;box-shadow:none!important;transform:none!important;margin:0!important}
  .drag-target-block{position:absolute;z-index:4;pointer-events:none;border-radius:20px;background:rgba(0,0,0,.075);border:1px dashed rgba(0,0,0,.12);box-shadow:inset 0 0 0 1px rgba(0,0,0,.025);transition:left .08s ease,top .08s ease,width .08s ease,height .08s ease}
  .app.drag-placeholder{opacity:0!important;visibility:hidden!important;pointer-events:none!important;transform:translateZ(0)!important;transition:none!important;z-index:-1!important}
  .app.drag-placeholder iframe,.app.drag-placeholder .icon{visibility:hidden!important}

  .app{position:relative;width:100%;height:80px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;z-index:2;transform:translate3d(0,0,0);transition:transform .18s cubic-bezier(.2,.8,.2,1);touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
  .app .icon{pointer-events:none}
  .icon{width:64px;height:64px;background-color:var(--white);border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.03);display:flex;justify-content:center;align-items:center;font-size:13px;color:var(--text-color);font-weight:500;border:1px solid rgba(0,0,0,.02);transition:transform .16s ease,background-color .16s,box-shadow .16s ease;flex-shrink:0}
  .app:active .icon{background-color:#f0f0f0}
  .label{font-size:12px;color:var(--gray-color);text-align:center;font-weight:400;white-space:nowrap;pointer-events:none}
  .app .icon{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease,box-shadow .18s ease}
  .app:active .icon{transform:scale(.94);box-shadow:0 2px 8px rgba(0,0,0,.035)}


  .drag-ghost{position:fixed!important;z-index:2147483647!important;margin:0!important;pointer-events:none!important;transition:none!important;animation:none!important;transform:scale(1.04)!important;opacity:1!important;filter:drop-shadow(0 18px 28px rgba(0,0,0,.18))}
  .drag-ghost .icon{box-shadow:0 18px 38px rgba(0,0,0,.16)}
  .app.releasing{transition:left .24s cubic-bezier(.2,.9,.2,1),top .24s cubic-bezier(.2,.9,.2,1),transform .24s ease}
  body.edit-mode .app:not(.dragging):not(.drag-placeholder){animation:jiggle .55s infinite alternate ease-in-out}
  body.is-dragging-app .app{animation:none!important}
  @keyframes jiggle{0%{transform:rotate(-1.15deg)}100%{transform:rotate(1.15deg)}}

  .edge-hint{position:absolute;top:0;bottom:0;width:80px;pointer-events:none;z-index:50;opacity:0;transition:opacity .18s ease,background .18s ease}
  .edge-hint.left{left:0}
  .edge-hint.right{right:0}
  .edge-hint.active{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.08),transparent)}
  .edge-hint.right.active{background:linear-gradient(to left,rgba(0,0,0,.08),transparent)}
  .edge-hint.armed{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.18),transparent)}
  .edge-hint.right.armed{background:linear-gradient(to left,rgba(0,0,0,.18),transparent)}

  .home-indicator-area{position:relative;z-index:500;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center}
  .home-indicator{min-width:42px;height:28px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.88);box-shadow:0 5px 16px rgba(0,0,0,.055),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);transform:translateY(-8px);transition:min-width .2s ease,padding .2s ease,transform .2s ease,background .2s ease}
  .home-indicator.search-mode{min-width:76px;padding-left:12px;padding-right:14px}
  .search-label{display:inline-block;font-size:13px;line-height:1;color:#666;letter-spacing:.2px;white-space:nowrap;font-weight:500}
  .search-symbol{display:block;flex-shrink:0}
  .page-dots{display:none;align-items:center;justify-content:center;gap:5px;max-width:120px}
  .home-indicator.pages-mode .search-symbol,.home-indicator.pages-mode .search-label{display:none}
  .home-indicator.pages-mode .page-dots{display:inline-flex}
  .page-dot{width:6px;height:6px;border-radius:50%;background:rgba(90,90,90,.42);flex:0 0 6px;border:0;padding:0;cursor:pointer;transition:background .2s ease}
  .page-dot.active{width:7.5px;height:7.5px;flex-basis:7.5px;background:rgba(40,40,40,.78)}
  body.edit-mode .home-indicator{transform:translateY(-10px)}

  .dock-wrapper{padding:10px 15px 35px;z-index:10;flex:0 0 auto}
  .dock{height:88px;position:relative;background:rgba(255,255,255,.65);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 15px;box-shadow:0 8px 30px rgba(0,0,0,.05);border:1px solid rgba(255,255,255,.8);min-width:100%;touch-action:none}
  .dock.drag-target{box-shadow:0 8px 30px rgba(0,0,0,.05),0 0 0 2px rgba(0,0,0,.045)}
  .dock .app{flex:1 1 0;min-width:0;max-width:72px;width:auto;height:auto;gap:0;transform:none;animation:none!important;transition:transform .16s ease}
  .dock .app .label{display:none}
  body.dragging-app .dock .app:not(.dragging){transition:transform .16s cubic-bezier(.2,.8,.2,1)}
  .app::before,.app::after{content:none!important;display:none!important}

  .app-launch-overlay{position:fixed;inset:0;z-index:200000;background:#fff;transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .28s ease;display:flex;flex-direction:column}
  .app-launch-overlay.show{transform:translateY(0);opacity:1;pointer-events:auto}
  .app-launch-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:max(10px,env(safe-area-inset-top)) 10px 8px;background:rgba(247,247,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.05)}
  .app-launch-back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.05);cursor:pointer;flex-shrink:0}
  .app-launch-back:active{background:rgba(0,0,0,.1)}
  .app-launch-title{font-size:15px;font-weight:600;color:#111}
  .app-launch-body{flex:1 1 auto;min-height:0}
  .app-launch-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>

<div class="dynamic-edit-pill">
  <div class="dep-btn" id="addPageBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    新页
  </div>
  <div class="dep-btn danger" id="delPageBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
    删页
  </div>
  <div class="dep-divider"></div>
  <div class="dep-btn primary" id="doneBtn">完成</div>
</div>

<div class="pages-viewport" id="pagesViewport">
  <div class="edge-hint left" id="edgeHintLeft"></div>
  <div class="edge-hint right" id="edgeHintRight"></div>
  <div class="desktop home-page active-page" id="desktop" data-page="0">
    <div class="app"><div class="icon">微信</div><span class="label">微信</span></div>
    <div class="app"><div class="icon">世界书</div><span class="label">世界书</span></div>
    <div class="app"><div class="icon">档案</div><span class="label">档案</span></div>
    <div class="app"><div class="icon">设置</div><span class="label">设置</span></div>
    <div class="app"><div class="icon">倒数日</div><span class="label">倒数日</span></div>
    <div class="app"><div class="icon">资源库</div><span class="label">资源库</span></div>
    <div class="app"><div class="icon">美化</div><span class="label">美化</span></div>
  </div>
</div>

<div class="home-indicator-area" id="homeIndicatorArea">
  <div class="home-indicator" id="homeIndicator" aria-label="页面指示器">
    <svg class="search-symbol" id="searchSymbol" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span class="search-label" id="searchLabel">搜索</span>
    <span class="page-dots" id="pageDots"></span>
  </div>
</div>

<div class="dock-wrapper">
  <div class="dock" id="dock">
    <div class="app"><div class="icon">短信</div><span class="label">短信</span></div>
    <div class="app"><div class="icon">浏览器</div><span class="label">浏览器</span></div>
    <div class="app"><div class="icon">电话</div><span class="label">电话</span></div>
    <div class="app"><div class="icon">此刻</div><span class="label">此刻</span></div>
  </div>
</div>

<div class="app-launch-overlay" id="appLaunchOverlay">
  <div class="app-launch-bar">
    <div class="app-launch-back" id="appLaunchBack">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="app-launch-title" id="appLaunchTitle">资源库</div>
  </div>
  <div class="app-launch-body"><iframe id="appLaunchFrame" src="about:blank"></iframe></div>
</div>


<script>
(() => {
  'use strict';
  const COLS=4,ROWS=6,SLOT_COUNT=COLS*ROWS;
  const LONG_PRESS_MS=700,CANCEL_PRESS_PX=10,SWIPE_START_PX=3,SWIPE_AXIS_RATIO=1.02,VERTICAL_BAIL_PX=9;
  const FLIP_RATIO=.07,FLIP_VELOCITY=.35,EDGE_DAMP=.28;
  const EDGE_ZONE=72,EDGE_HOLD_MS=160,EDGE_REPEAT_DELAY=1200,EDGE_FLIP_DURATION=360;

  const body=document.body;
  const viewport=document.getElementById('pagesViewport');
  const dock=document.getElementById('dock');
  const homeIndicator=document.getElementById('homeIndicator');
  const searchSymbol=document.getElementById('searchSymbol');
  const searchLabel=document.getElementById('searchLabel');
  const pageDots=document.getElementById('pageDots');
  const addPageBtn=document.getElementById('addPageBtn');
  const delPageBtn=document.getElementById('delPageBtn');
  const doneBtn=document.getElementById('doneBtn');
  const edgeHintLeft=document.getElementById('edgeHintLeft');
  const edgeHintRight=document.getElementById('edgeHintRight');

  const APP_URLS={'资源库':'资源库 2.html'};
  const appLaunchOverlay=document.getElementById('appLaunchOverlay');
  const appLaunchBack=document.getElementById('appLaunchBack');
  const appLaunchTitle=document.getElementById('appLaunchTitle');
  const appLaunchFrame=document.getElementById('appLaunchFrame');

  function openLaunchApp(name){const url=APP_URLS[name];if(!url)return;appLaunchTitle.textContent=name;appLaunchFrame.src=url;appLaunchOverlay.classList.add('show')}
  function closeLaunchApp(){appLaunchOverlay.classList.remove('show');setTimeout(()=>{appLaunchFrame.src='about:blank'},400)}
  if(appLaunchBack)appLaunchBack.addEventListener('click',closeLaunchApp);
  if(appLaunchOverlay)appLaunchOverlay.addEventListener('pointerdown',e=>e.stopPropagation());

  let pages=[],currentPageIndex=0,desktop=null;
  let pagePos=0,rafHandle=0,anim=null;
  let editMode=false,appDrag=null,swipe=null,pressTimer=null,pressOrigin=null,pressStartTime=0,suppressNextClick=false;
  let edgeTimer=null,edgeDir=0,edgeHasFlipped=false;

  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const easeOutSmooth=t=>1-Math.pow(1-t,2.8);
  const damp=x=>Math.min(x*EDGE_DAMP,EDGE_DAMP);
  const isWidgetEl=el=>el.classList.contains('widget-2x2')||el.classList.contains('widget-4x2')||el.classList.contains('widget-4x3');

  function getPages(){return Array.from(viewport.querySelectorAll(':scope > .desktop.home-page'))}

  function renderPages(pos){
    const n=pages.length;
    for(let i=0;i<n;i++){
      const p=pages[i],rel=i-pos,inView=rel>-1.5&&rel<1.5;
      if(inView){
        if(!p._visible){p._visible=true;p.style.visibility='visible'}
        p.style.transform='translate3d('+(rel*100)+'%,0,0)';
      }else if(p._visible){p._visible=false;p.style.visibility='hidden';p.style.transform=''}
    }
  }

  function cancelAnim(){if(rafHandle){cancelAnimationFrame(rafHandle);rafHandle=0}anim=null}

  function animateTo(target,duration){
    cancelAnim();
    const maxIdx=pages.length-1;
    target=clamp(Math.round(target*1000)/1000,0,maxIdx);
    const targetIndex=Math.round(target);
    if(targetIndex!==currentPageIndex){
      currentPageIndex=targetIndex;
      desktop=pages[targetIndex];
      for(let i=0;i<pages.length;i++)pages[i].classList.toggle('active-page',i===targetIndex);
      updatePageIndicator();
    }
    const from=pagePos,dist=target-from;
    if(Math.abs(dist)<.0005){pagePos=target;renderPages(pagePos);return}
    const dur=duration!=null?duration:clamp(380+Math.abs(dist)*90,380,500);
    anim={from,to:target,start:performance.now(),duration:dur};
    const tick=now=>{
      if(!anim)return;
      const t=clamp((now-anim.start)/anim.duration,0,1);
      pagePos=anim.from+(anim.to-anim.from)*easeOutSmooth(t);
      renderPages(pagePos);
      if(t<1)rafHandle=requestAnimationFrame(tick);
      else{rafHandle=0;pagePos=anim.to;anim=null;renderPages(pagePos)}
    };
    rafHandle=requestAnimationFrame(tick);
  }

  function commitPage(index){
    currentPageIndex=index;desktop=pages[index];pagePos=index;
    for(let i=0;i<pages.length;i++)pages[i].classList.toggle('active-page',i===index);
    updatePageIndicator();
  }
  function goToPage(index){index=clamp(Math.round(index),0,pages.length-1);if(index===currentPageIndex&&pagePos===index)return;animateTo(index)}
  window.showPage=goToPage;

  function clearEdgeTimer(){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=null}edgeDir=0;edgeHasFlipped=false;edgeHintLeft.classList.remove('active','armed');edgeHintRight.classList.remove('active','armed')}
  function setEdgeHint(dir,armed){edgeHintLeft.classList.remove('active','armed');edgeHintRight.classList.remove('active','armed');if(dir===-1){edgeHintLeft.classList.add('active');if(armed)edgeHintLeft.classList.add('armed')}else if(dir===1){edgeHintRight.classList.add('active');if(armed)edgeHintRight.classList.add('armed')}}
  function checkEdgeTrigger(x){
    if(!appDrag){clearEdgeTimer();return}
    const rect=viewport.getBoundingClientRect();
    const distLeft=x-rect.left,distRight=rect.right-x;
    let dir=0;
    if(distLeft<EDGE_ZONE&&currentPageIndex>0)dir=-1;
    else if(distRight<EDGE_ZONE&&currentPageIndex<pages.length-1)dir=1;
    if(dir===0){clearEdgeTimer();return}
    if(dir===edgeDir&&edgeTimer){setEdgeHint(dir,false);return}
    if(dir!==edgeDir){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=null}edgeDir=dir;edgeHasFlipped=false}
    setEdgeHint(dir,false);scheduleEdgeFlip(dir,EDGE_HOLD_MS);
  }
  function scheduleEdgeFlip(dir,wait){
    edgeTimer=setTimeout(()=>{
      edgeTimer=null;if(!appDrag||edgeDir!==dir)return;
      const newIndex=currentPageIndex+dir;
      if(newIndex<0||newIndex>=pages.length){edgeDir=0;edgeHasFlipped=false;setEdgeHint(0,false);return}
      edgeHasFlipped=true;animateTo(newIndex,EDGE_FLIP_DURATION);setEdgeHint(dir,true);
      if(navigator.vibrate)navigator.vibrate(6);
      scheduleEdgeFlip(dir,EDGE_REPEAT_DELAY);
    },wait);
  }



  function resizeWidgetPreviews(){
    document.querySelectorAll('.widget-group').forEach(group=>{
      const card=group.querySelector('.widget-card');
      const frame=group.querySelector('.widget-embed');
      if(!card||!frame)return;
      const baseW=Number(group.dataset.frameW)||160;
      const baseH=Number(group.dataset.frameH)||160;
      const scale=Math.min(card.clientWidth/baseW,card.clientHeight/baseH);
      frame.style.width=baseW+'px';
      frame.style.height=baseH+'px';
      frame.style.transform=`scale(${scale})`;
    });
  }
  function fitDesktopWidgets(){
    document.querySelectorAll('.app.widget-2x2,.app.widget-4x2,.app.widget-4x3').forEach(app=>{
      const icon=app.querySelector('.icon');
      const frame=app.querySelector('.widget-frame');
      if(!icon||!frame)return;
      const fw=Number(app.dataset.frameW)||160;
      const fh=Number(app.dataset.frameH)||160;
      const iw=icon.clientWidth,ih=icon.clientHeight;
      if(iw===0||ih===0)return;
      const scale=Math.min(iw/fw,ih/fh);
      frame.style.width=fw+'px';
      frame.style.height=fh+'px';
      frame.style.transform=`translate(-50%,-50%) scale(${scale})`;
    });
  }


  function onPointerDown(e){
    if(e.pointerType==='mouse'&&e.button>0)return;
    if(!pages.length)return;
    const inViewport=viewport.contains(e.target);
    const inDock=dock.contains(e.target);
    if(!inViewport&&!inDock)return;
    if(editMode){
      const appEl=e.target.closest('.app');
      if(appEl){const parent=appEl.parentElement;if(parent===desktop||parent===dock){e.preventDefault();startAppDrag(appEl,e);return}}
      if(inViewport)startSwipe(e);
      return;
    }
    if(inViewport)startSwipe(e);
    clearPressTimer();
    pressOrigin={x:e.clientX,y:e.clientY};
    pressStartTime=performance.now();
    pressTimer=setTimeout(()=>{
      if(performance.now()-pressStartTime<LONG_PRESS_MS-30)return;
      pressTimer=null;
      if(!swipe||!swipe.active){enterEditMode();suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350)}
    },LONG_PRESS_MS);
  }
  function clearPressTimer(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}pressOrigin=null}

  function onPointerMove(e){
    if(appDrag){if(e.pointerId!==appDrag.pointerId)return;e.preventDefault();moveAppDrag(e);return}
    if(swipe&&e.pointerId===swipe.pointerId){moveSwipe(e);return}
    if(pressOrigin){const dx=e.clientX-pressOrigin.x,dy=e.clientY-pressOrigin.y;if(dx*dx+dy*dy>CANCEL_PRESS_PX*CANCEL_PRESS_PX)clearPressTimer()}
  }

  function startSwipe(e){cancelAnim();const rect=viewport.getBoundingClientRect();swipe={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastTime:performance.now(),width:rect.width||1,basePos:pagePos,velocity:0,active:false}}
  function moveSwipe(e){
    const s=swipe,dx=e.clientX-s.startX,dy=e.clientY-s.startY,adx=Math.abs(dx),ady=Math.abs(dy);
    if(adx+ady>CANCEL_PRESS_PX)clearPressTimer();
    if(!s.active){if(adx>SWIPE_START_PX&&adx>ady*SWIPE_AXIS_RATIO)s.active=true;else if(ady>VERTICAL_BAIL_PX&&ady>adx*SWIPE_AXIS_RATIO){swipe=null;clearPressTimer();return}else return}
    const now=performance.now(),dt=now-s.lastTime;
    if(dt>0&&dt<80){const v=-(e.clientX-s.lastX)/dt*1000/s.width;s.velocity=s.velocity*.32+v*.68}
    s.lastX=e.clientX;s.lastTime=now;
    let pos=s.basePos-dx/s.width;const maxIdx=pages.length-1;
    if(pos<0)pos=-damp(-pos);else if(pos>maxIdx)pos=maxIdx+damp(pos-maxIdx);
    pagePos=pos;renderPages(pos);
  }
  function endSwipe(e){
    const s=swipe;swipe=null;if(!s)return;
    if(!s.active){clearPressTimer();animateTo(Math.round(pagePos),320);return}
    suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350);
    const maxIdx=pages.length-1;
    const sinceLast=performance.now()-s.lastTime;
    const decay=sinceLast>0?Math.max(0,1-sinceLast/160):1;
    const vPages=s.velocity*decay;
    const netDx=e.clientX-s.startX,ratio=Math.abs(netDx)/s.width;
    let dir=0;if(netDx<0)dir=1;else if(netDx>0)dir=-1;
    if(Math.abs(vPages)>FLIP_VELOCITY)dir=vPages>0?1:-1;
    const shouldFlip=Math.abs(vPages)>FLIP_VELOCITY||ratio>FLIP_RATIO;
    let target;const base=s.basePos;
    if(shouldFlip&&dir!==0)target=dir>0?Math.floor(base+.001)+1:Math.ceil(base-.001)-1;
    else if(dir!==0&&ratio>.012)target=Math.round(base+dir*.28);
    else target=Math.round(base);
    target=clamp(target,0,maxIdx);
    const dist=Math.abs(target-pagePos);const duration=clamp(360+dist*100,360,460);
    animateTo(target,duration);
  }
  function onPointerUp(e){
    if(appDrag){endAppDrag(e);return}
    if(swipe&&e.pointerId===swipe.pointerId){endSwipe(e);return}
    clearPressTimer();
  }
  function onPointerCancel(e){
    if(appDrag){cancelAppDrag();clearPressTimer();return}
    if(swipe){
      const s=swipe;swipe=null;
      if(s.active){
        suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350);
        animateTo(Math.round(pagePos),360);
      }else animateTo(Math.round(pagePos),320);
    }
    clearPressTimer();
  }

  function buildGrid(target){
    let grid=target.querySelector('.desktop-grid');
    if(!grid){grid=document.createElement('div');grid.className='desktop-grid';target.prepend(grid)}
    if(grid.childElementCount===SLOT_COUNT)return;
    grid.innerHTML='';
    const frag=document.createDocumentFragment();
    for(let i=0;i<SLOT_COUNT;i++){const slot=document.createElement('div');slot.className='grid-slot';slot.dataset.index=i;frag.appendChild(slot)}
    grid.appendChild(frag);
  }
  function setDesktopSlot(app,index,animate){
    index=clamp(Number(index)||0,0,SLOT_COUNT-1);
    app.dataset.area='desktop';app.dataset.slot=String(index);
    const w=app.dataset.w||'1',h=app.dataset.h||'1';
    app.style.gridColumn=`${(index%COLS)+1} / span ${w}`;
    app.style.gridRow=`${Math.floor(index/COLS)+1} / span ${h}`;
    if(animate){app.classList.add('releasing');setTimeout(()=>app.classList.remove('releasing'),220)}
    requestAnimationFrame(fitDesktopWidgets);
  }
  function normalizeDockSlots(){Array.from(dock.querySelectorAll(':scope > .app')).forEach((app,i)=>{app.dataset.area='dock';app.dataset.slot=String(i);app.style.gridColumn='';app.style.gridRow=''})}
  function initializeSlots(){pages.forEach(page=>{page.querySelectorAll(':scope > .app').forEach((app,i)=>setDesktopSlot(app,i,false))});normalizeDockSlots()}
  function desktopApps(){return Array.from(desktop.querySelectorAll(':scope > .app'))}
  function dockApps(){return Array.from(dock.querySelectorAll(':scope > .app'))}

  function occupiedDesktop(index,except,w,h){
    const aw=w||1,ah=h||1;
    const tc=index%COLS,tr=Math.floor(index/COLS);
    return desktopApps().find(a=>{
      if(a===except)return false;
      const aIdx=Number(a.dataset.slot);
      if(isNaN(aIdx))return false;
      const aW=Number(a.dataset.w||1),aH=Number(a.dataset.h||1);
      const ac=aIdx%COLS,ar=Math.floor(aIdx/COLS);
      return !(tc+aw<=ac||tc>=ac+aW||tr+ah<=ar||tr>=ar+aH);
    })||null;
  }

  function findFreeSlot(desktopEl,w,h,except){
    const items=Array.from(desktopEl.querySelectorAll(':scope > .app')).filter(a=>a!==except);
    const occupied=Array.from({length:ROWS},()=>Array(COLS).fill(false));
    items.forEach(a=>{
      const idx=Number(a.dataset.slot);
      if(isNaN(idx))return;
      const aw=Number(a.dataset.w||1),ah=Number(a.dataset.h||1);
      const ac=idx%COLS,ar=Math.floor(idx/COLS);
      for(let dy=0;dy<ah;dy++)for(let dx=0;dx<aw;dx++){
        const r=ar+dy,c=ac+dx;
        if(r<ROWS&&c<COLS)occupied[r][c]=true;
      }
    });
    for(let r=0;r<=ROWS-h;r++)for(let c=0;c<=COLS-w;c++){
      let free=true;
      for(let dy=0;dy<h;dy++)for(let dx=0;dx<w;dx++){if(occupied[r+dy][c+dx]){free=false;break}}
      if(free)return r*COLS+c;
    }
    return -1;
  }

  function relocateOverlaps(widgetEl){
    if(!widgetEl||widgetEl.dataset.slot==null)return;
    const queue=[widgetEl];
    const moved=new Set([widgetEl]);
    let guard=0;
    while(queue.length && guard++<COLS*ROWS*2){
      const anchor=queue.shift();
      if(!anchor||anchor.dataset.slot==null)continue;
      const si=Number(anchor.dataset.slot);
      const sw=Number(anchor.dataset.w||1),sh=Number(anchor.dataset.h||1);
      const sc=si%COLS,sr=Math.floor(si/COLS);
      const overlaps=desktopApps().filter(a=>{
        if(a===anchor||moved.has(a))return false;
        const ai=Number(a.dataset.slot);
        if(isNaN(ai))return false;
        const aw=Number(a.dataset.w||1),ah=Number(a.dataset.h||1);
        const ac=ai%COLS,ar=Math.floor(ai/COLS);
        return !(sc+sw<=ac||sc>=ac+aw||sr+sh<=ar||sr>=ar+ah);
      });
      overlaps.forEach(a=>{
        const aw=Number(a.dataset.w||1),ah=Number(a.dataset.h||1);
        const free=findFreeSlot(desktop,aw,ah,a);
        if(free>=0){
          setDesktopSlot(a,free,true);
          moved.add(a);
          queue.push(a);
        }
      });
    }
    requestAnimationFrame(fitDesktopWidgets);
  }

  function clearTarget(){
    desktop.querySelectorAll('.grid-slot.target').forEach(s=>s.classList.remove('target'));
    const block=desktop.querySelector('.drag-target-block');
    if(block)block.remove();
    dock.classList.remove('drag-target');
  }
  function showTarget(area,index,w=1,h=1){
    clearTarget();
    if(area==='desktop'){
      const start=Number(index)||0;
      const cw=clamp(Number(w)||1,1,COLS);
      const ch=clamp(Number(h)||1,1,ROWS);
      const startCol=start%COLS;
      const startRow=Math.floor(start/COLS);
      const grid=desktop.querySelector('.desktop-grid');
      if(!grid)return;
      const block=document.createElement('div');
      block.className='drag-target-block';
      block.style.gridColumn=`${startCol+1} / span ${cw}`;
      block.style.gridRow=`${startRow+1} / span ${ch}`;
      grid.appendChild(block);
    }else dock.classList.add('drag-target');
  }
  function pointInRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
  function nearestDesktopSlot(x,y,w,h){
    const r=viewport.getBoundingClientRect(),cs=getComputedStyle(desktop);
    const pl=parseFloat(cs.paddingLeft)||0,pt=parseFloat(cs.paddingTop)||0;
    const gx=parseFloat(cs.columnGap)||0,gy=parseFloat(cs.rowGap)||0;
    const innerW=r.width-pl*2,innerH=r.height-pt*2;
    const cellW=(innerW-gx*(COLS-1))/COLS,cellH=(innerH-gy*(ROWS-1))/ROWS;
    const localX=clamp(x-r.left-pl,0,innerW-1),localY=clamp(y-r.top-pt,0,innerH-1);
    const cw=clamp(w||1,1,COLS),ch=clamp(h||1,1,ROWS);
    const stepX=cellW+gx,stepY=cellH+gy;
    const rawCol=(localX+gx/2)/stepX;
    const rawRow=(localY+gy/2)/stepY;
    const col=clamp(Math.floor(rawCol),0,COLS-cw);
    const row=clamp(Math.floor(rawRow),0,ROWS-ch);
    return row*COLS+col;
  }
  function nearestDockInsertIndex(x){const items=dockApps().filter(a=>!appDrag||a!==appDrag.app);for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(x<r.left+r.width/2)return i}return items.length}
  function createDragGhost(app,rect){const ghost=app.cloneNode(true);ghost.classList.remove('drag-placeholder','dragging');ghost.classList.add('drag-ghost');ghost.removeAttribute('style');ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';ghost.style.pointerEvents='none';document.body.appendChild(ghost);return ghost}

  function startAppDrag(app,e){
    if(appDrag)return;
    const rect=app.getBoundingClientRect();
    const originArea=app.dataset.area||(app.parentElement===dock?'dock':'desktop');
    const originSlot=Number(app.dataset.slot||0);
    edgeHasFlipped=false;
    appDrag={
      app,pointerId:e.pointerId,originArea,originSlot,
      originPageIndex:currentPageIndex,currentArea:originArea,
      currentSlot:originSlot,startX:e.clientX,startY:e.clientY,
      moved:false,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,
      ghost:null,rect,justAdded:false
    };
    try{app.setPointerCapture(e.pointerId)}catch(_){}
  }

  function moveAppDrag(e){
    const d=appDrag;
    if(!d)return;
    e.preventDefault();
    if(!d.moved){
      const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
      if(dx*dx+dy*dy>20){
        d.moved=true;
        d.app.classList.add('drag-placeholder','dragging');
        body.classList.add('is-dragging-app','dragging-app');
        showTarget(d.currentArea,d.currentSlot,Number(d.app.dataset.w||1),Number(d.app.dataset.h||1));
        if(!d.ghost)d.ghost=createDragGhost(d.app,d.rect);
      }
    }
    if(!d.moved)return;
    if(d.ghost){
      d.ghost.style.left=(e.clientX-d.offsetX)+'px';
      d.ghost.style.top=(e.clientY-d.offsetY-2)+'px';
    }
    const dockRect=document.querySelector('.dock-wrapper').getBoundingClientRect();
    const desktopRect=viewport.getBoundingClientRect();
    const isWidget=isWidgetEl(d.app);
    const aw=Number(d.app.dataset.w||1),ah=Number(d.app.dataset.h||1);
    if(pointInRect(e.clientX,e.clientY,dockRect)&&!isWidget){
      d.currentArea='dock';d.currentSlot=nearestDockInsertIndex(e.clientX);
      showTarget('dock',d.currentSlot);clearEdgeTimer();
    }else if(pointInRect(e.clientX,e.clientY,desktopRect)){
      d.currentArea='desktop';d.currentSlot=nearestDesktopSlot(e.clientX,e.clientY,aw,ah);
      showTarget('desktop',d.currentSlot,aw,ah);checkEdgeTrigger(e.clientX);
    }else clearEdgeTimer();
  }

  function endAppDrag(e){
    const d=appDrag;if(!d||e.pointerId!==d.pointerId)return;
    clearEdgeTimer();edgeHasFlipped=false;
    if(d.moved){suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350)}
    const app=d.app;
    const aw=Number(app.dataset.w||1),ah=Number(app.dataset.h||1);
    const isWidget=isWidgetEl(app);

    if(d.justAdded&&!d.moved){
      app.classList.remove('drag-placeholder','dragging');
      if(d.ghost)d.ghost.remove();
      clearTarget();
      appDrag=null;
      body.classList.remove('is-dragging-app','dragging-app');
      requestAnimationFrame(fitDesktopWidgets);
      return;
    }

    const dockRect=document.querySelector('.dock-wrapper').getBoundingClientRect();
    const desktopRect=viewport.getBoundingClientRect();
    let area=d.currentArea,slot=d.currentSlot;
    if(pointInRect(e.clientX,e.clientY,dockRect)&&!isWidget){
      area='dock';slot=nearestDockInsertIndex(e.clientX);
    }else if(pointInRect(e.clientX,e.clientY,desktopRect)||isWidget){
      area='desktop';slot=nearestDesktopSlot(e.clientX,e.clientY,aw,ah);
    }
    clearTarget();
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    if(area==='dock'){
      const others=dockApps().filter(x=>x!==app);
      const at=clamp(slot,0,others.length);
      dock.insertBefore(app,others[at]||null);
      normalizeDockSlots();
    }else{
      if(app.parentElement!==desktop)desktop.appendChild(app);
      setDesktopSlot(app,slot,true);
      relocateOverlaps(app);
    }
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    appDrag=null;
    body.classList.remove('is-dragging-app','dragging-app');
    updatePageIndicator();
    requestAnimationFrame(fitDesktopWidgets);
  }

  function cancelAppDrag(){
    const d=appDrag;if(!d)return;
    clearEdgeTimer();edgeHasFlipped=false;
    if(d.moved){suppressNextClick=true;setTimeout(()=>{suppressNextClick=false},350)}
    const app=d.app;
    app.classList.remove('drag-placeholder','dragging');
    if(d.ghost)d.ghost.remove();
    if(d.originArea==='dock'){
      if(app.parentElement!==dock)dock.appendChild(app);
      const items=dockApps().filter(x=>x!==app);
      dock.insertBefore(app,items[Math.min(d.originSlot,items.length)]||null);
      normalizeDockSlots();
    }else{
      const originPage=pages[d.originPageIndex]||pages[0];
      if(app.parentElement!==originPage)originPage.appendChild(app);
      setDesktopSlot(app,d.originSlot,false);
    }
    try{app.releasePointerCapture(d.pointerId)}catch(_){}
    clearTarget();appDrag=null;
    body.classList.remove('is-dragging-app','dragging-app');
    requestAnimationFrame(fitDesktopWidgets);
  }

  function enterEditMode(){if(editMode)return;editMode=true;body.classList.add('edit-mode');if(navigator.vibrate)navigator.vibrate(45)}
  function exitEditMode(){if(!editMode)return;if(appDrag)cancelAppDrag();editMode=false;body.classList.remove('edit-mode');clearTarget();clearEdgeTimer();edgeHasFlipped=false}


  body.addEventListener('click',e=>{
    if(suppressNextClick)return;
    if(!editMode){const appEl=e.target.closest('.app');if(appEl){const labelEl=appEl.querySelector('.label');const name=labelEl?labelEl.textContent.trim():'';if(APP_URLS[name]){openLaunchApp(name);return}}}
    if(editMode&&!e.target.closest('.app')&&!e.target.closest('.dynamic-edit-pill')&&!e.target.closest('.widget-modal'))exitEditMode();
  });

  function addPage(){if(!editMode)return;const page=document.createElement('div');page.className='desktop home-page';page.dataset.page=String(pages.length);viewport.appendChild(page);buildGrid(page);pages=getPages();if(navigator.vibrate)navigator.vibrate(30);animateTo(pages.length-1,420)}
  function deletePage(){
    if(!editMode)return;
    if(currentPageIndex===0||pages.length<=1){if(navigator.vibrate)navigator.vibrate([18,35,18]);return}
    cancelAnim();
    const delIdx=currentPageIndex,toDelete=pages[delIdx],remain=[];
    pages.forEach(pg=>{if(pg===toDelete)return;pg.querySelectorAll(':scope > .app').forEach(a=>remain.push(a))});
    toDelete.remove();
    pages=getPages();pages.forEach((pg,i)=>{pg.dataset.page=String(i)});
    const perPage=Math.ceil(remain.length/pages.length)||1;
    remain.forEach((app,i)=>{
      const pi=Math.min(Math.floor(i/perPage),pages.length-1);
      const si=i%perPage;
      pages[pi].appendChild(app);
      setDesktopSlot(app,si,false);
    });
    pages.forEach(pg=>buildGrid(pg));
    let newIdx=Math.min(delIdx,pages.length-1);if(newIdx<0)newIdx=0;
    commitPage(newIdx);renderPages(newIdx);
    if(navigator.vibrate)navigator.vibrate(30);
  }

  function updatePageIndicator(){
    const count=pages.length,isHome=currentPageIndex===0;
    homeIndicator.classList.toggle('search-mode',isHome);
    homeIndicator.classList.toggle('pages-mode',!isHome&&count>1);
    searchSymbol.style.display=isHome?'block':'none';
    searchLabel.style.display=isHome?'inline-block':'none';
    pageDots.innerHTML='';
    if(!isHome&&count>1){
      let start=Math.max(0,currentPageIndex-1),end=start+2;
      if(end>=count){end=count-1;start=Math.max(0,end-2)}
      const frag=document.createDocumentFragment();
      for(let i=start;i<=end;i++){const dot=document.createElement('button');dot.type='button';dot.className='page-dot'+(i===currentPageIndex?' active':'');dot.setAttribute('aria-label','第 '+(i+1)+' 页');dot.addEventListener('click',ev=>{ev.stopPropagation();goToPage(i)});frag.appendChild(dot)}
      pageDots.appendChild(frag);
    }
  }

  document.addEventListener('pointerdown',onPointerDown,{passive:false});
  window.addEventListener('pointermove',onPointerMove,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:false});
  window.addEventListener('pointercancel',onPointerCancel,{passive:false});
  addPageBtn.addEventListener('click',addPage);
  delPageBtn.addEventListener('click',deletePage);
  doneBtn.addEventListener('click',exitEditMode);
  document.addEventListener('gesturestart',e=>e.preventDefault());

  pages=getPages();
  pages.forEach(pg=>buildGrid(pg));
  initializeSlots();
  desktop=pages[0];pagePos=0;renderPages(0);commitPage(0);

  window.addEventListener('resize',()=>{cancelAnim();const rounded=Math.round(pagePos);pagePos=rounded;renderPages(rounded);commitPage(rounded);resizeWidgetPreviews();fitDesktopWidgets()},{passive:true});
})();
</script>
</body>
